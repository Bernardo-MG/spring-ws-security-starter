databaseChangeLog:
  - changeSet:
      id: security_schema
      author: Bernardo
      changes:
        - sqlFile:
            encoding: UTF-8
            path: sql/create_schema.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
  - changeSet:
      id: security_roles
      author: Bernardo
      changes:
        - createTable:
            schemaName: security
            tableName: roles
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(60)
                  constraints:
                    unique: true
                    nullable: false
        - addAutoIncrement:
            schemaName: security
            tableName: roles
            columnName: id
            columnDataType: bigint
            incrementBy: 1
            startWith: 1
        - createTable:
            schemaName: security
            tableName: role_permissions
            columns:
              - column:
                  name: role_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_role_permissions_role_id
                    references: security.roles(id)
                    nullable: false
              - column:
                  name: permission_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_role_permissions_permission_id
                    references: security.permissions(id)
                    nullable: false
        - addPrimaryKey:
            constraintName: role_permissions_key
            schemaName: security
            tableName: role_permissions
            columnNames: 'role_id, permission_id'
