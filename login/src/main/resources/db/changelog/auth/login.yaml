databaseChangeLog:
  - changeSet:
      id: security_schema
      author: Bernardo
      changes:
        - sqlFile:
            encoding: UTF-8
            path: sql/create_schema.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
  - changeSet:
      id: security_audit
      author: Bernardo
      changes:
        - createTable:
            schemaName: security
            tableName: login_registers
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: varchar(60)
                  constraints:
                    nullable: false
              - column:
                  name: logged_in
                  type: boolean
                  constraints:
                    nullable: false
                  defaultValueBoolean: false
              - column:
                  name: date
                  type: datetime
                  constraints:
                    nullable: false
        - addAutoIncrement:
            schemaName: security
            tableName: login_registers
            columnName: id
            columnDataType: bigint
            incrementBy: 1
            startWith: 1
        - addUniqueConstraint:
            constraintName: login_registers_unique
            schemaName: security
            tableName: login_registers
            columnNames: 'username, date'
