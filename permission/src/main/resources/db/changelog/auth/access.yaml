databaseChangeLog:
  - changeSet:
      id: security_schema
      author: Bernardo
      changes:
        - sqlFile:
            encoding: UTF-8
            path: sql/create_schema.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
  - changeSet:
      id: security_permissions
      author: Bernardo
      changes:
        - createTable:
            schemaName: security
            tableName: resources
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(60)
                  constraints:
                    unique: true
                    nullable: false
        - addAutoIncrement:
            schemaName: security
            tableName: resources
            columnName: id
            columnDataType: bigint
            incrementBy: 1
            startWith: 1
        - createTable:
            schemaName: security
            tableName: actions
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(60)
                  constraints:
                    unique: true
                    nullable: false
        - addAutoIncrement:
            schemaName: security
            tableName: actions
            columnName: id
            columnDataType: bigint
            incrementBy: 1
            startWith: 1
        - createTable:
            schemaName: security
            tableName: permissions
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: resource
                  type: varchar(60)
                  constraints:
                    foreignKeyName: fk_permissions_resource_id
                    references: security.resources(name)
                    nullable: false
                    deleteCascade: true
              - column:
                  name: action
                  type: varchar(60)
                  constraints:
                    foreignKeyName: fk_permissions_action_id
                    references: security.actions(name)
                    nullable: false
                    deleteCascade: true
        - addUniqueConstraint:
            constraintName: permissions_unique
            schemaName: security
            tableName: permissions
            columnNames: 'resource, action'
        - addAutoIncrement:
            schemaName: security
            tableName: permissions
            columnName: id
            columnDataType: bigint
            incrementBy: 1
            startWith: 1
