components:
  schemas:
    AuditDetails:
      type: object
      description: Audit info.
      properties:
        createdAt:
          $ref: '../common/dates.yml#/components/schemas/Date'
        createdBy:
          $ref: '#/components/schemas/AuditUser'
        updatedAt:
          $ref: '../common/dates.yml#/components/schemas/Date'
        updatedBy:
          $ref: '#/components/schemas/AuditUser'
    AuditUser:
      type: object
      description: Audit info.
      properties:
        email:
          type: string
          format: email
          description: User email address.
        username:
          type: string
          description: Unique username for the user.
        name:
          type: string
          description: Display name of the user.