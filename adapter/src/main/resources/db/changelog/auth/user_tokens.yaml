databaseChangeLog:
  - changeSet:
      id: token_tables
      author: Bernardo
      changes:
        - createTable:
            schemaName: security
            tableName: user_tokens
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_user_tokens
                    nullable: false
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_user_tokens_user
                    references: security.users(id)
                    nullable: false
                    deleteCascade: true
              - column:
                  name: scope
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: token
                  type: varchar(50)
                  constraints:
                    unique: true
                    uniqueConstraintName: uk_user_tokens_token
                    nullable: false
              - column:
                  name: creation_date
                  type: datetime
                  constraints:
                    nullable: false
              - column:
                  name: expiration_date
                  type: datetime
                  constraints:
                    nullable: false
              - column:
                  name: consumed
                  type: boolean
                  constraints:
                    nullable: false
                  defaultValueBoolean: false
              - column:
                  name: revoked
                  type: boolean
                  constraints:
                    nullable: false
                  defaultValueBoolean: false
        - addAutoIncrement:
            schemaName: security
            tableName: user_tokens
            columnName: id
            columnDataType: bigint
            incrementBy: 1
            startWith: 1
