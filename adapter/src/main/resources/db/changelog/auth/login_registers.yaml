databaseChangeLog:
  - changeSet:
      id: security_audit
      author: Bernardo
      changes:
        - createTable:
            schemaName: security
            tableName: login_registers
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_login_registers
                    nullable: false
              - column:
                  name: username
                  type: varchar(60)
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_login_registers_user
                    references: security.users(id)
                    deleteCascade: true
              - column:
                  name: logged_in
                  type: boolean
                  constraints:
                    nullable: false
                  defaultValueBoolean: false
              - column:
                  name: date
                  type: datetime
                  constraints:
                    nullable: false
        - addAutoIncrement:
            schemaName: security
            tableName: login_registers
            columnName: id
            columnDataType: bigint
            incrementBy: 1
            startWith: 1
        - addUniqueConstraint:
            constraintName: uk_login_registers_username_date
            schemaName: security
            tableName: login_registers
            columnNames: 'username, date'
