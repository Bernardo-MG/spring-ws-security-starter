databaseChangeLog:
  - changeSet:
      id: security_tables
      author: Bernardo
      changes:
        - createTable:
            schemaName: security
            tableName: users
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_users
                    nullable: false
              - column:
                  name: username
                  type: varchar(60)
                  constraints:
                    unique: true
                    uniqueConstraintName: uk_users_username
                    nullable: false
              - column:
                  name: password
                  type: varchar(60)
                  constraints:
                    nullable: false
                  defaultValue: ''
              - column:
                  name: name
                  type: varchar(50)
                  constraints:
                    nullable: false
                  defaultValue: ''
              - column:
                  name: email
                  type: varchar(60)
                  constraints:
                    unique: true
                    uniqueConstraintName: uk_users_email
                    nullable: false
                  defaultValue: ''
              - column:
                  name: password_not_expired
                  type: boolean
                  constraints:
                    nullable: false
                  defaultValueBoolean: true
              - column:
                  name: enabled
                  type: boolean
                  constraints:
                    nullable: false
                  defaultValueBoolean: true
              - column:
                  name: not_expired
                  type: boolean
                  constraints:
                    nullable: false
                  defaultValueBoolean: true
              - column:
                  name: not_locked
                  type: boolean
                  constraints:
                    nullable: false
                  defaultValueBoolean: true
              - column:
                  name: login_attempts
                  type: int
                  constraints:
                    nullable: false
                  defaultValue: '0'
              # Audit columns
              - column:
                  name: created_at
                  type: datetime
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: true
              - column:
                  name: created_by
                  type: bigint
                  constraints:
                    nullable: true
              - column:
                  name: updated_at
                  type: datetime
                  constraints:
                    nullable: true
              - column:
                  name: updated_by
                  type: bigint
                  constraints:
                    nullable: true
        - addForeignKeyConstraint:
            constraintName: fk_users_created_by_user
            baseTableSchemaName: security
            baseTableName: users
            baseColumnNames: created_by
            referencedTableSchemaName: security
            referencedTableName: users
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_users_updated_by_user
            baseTableSchemaName: security
            baseTableName: users
            baseColumnNames: updated_by
            referencedTableSchemaName: security
            referencedTableName: users
            referencedColumnNames: id
        - addAutoIncrement:
            schemaName: security
            tableName: users
            columnName: id
            columnDataType: bigint
            incrementBy: 1
            startWith: 1
